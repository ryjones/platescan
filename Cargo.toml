[package]
name = "platescan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
image = "0.25.10"
leptess = "0.14.0"
leptonica-sys = "0.4.9"
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
regex = "1.13.1"
serde_json = "1.0.151"
zip = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
